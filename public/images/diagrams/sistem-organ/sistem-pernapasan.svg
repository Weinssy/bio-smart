<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#f0f9ff" rx="20"/>
  <text x="400" y="60" font-family="sans-serif" font-size="28" font-weight="bold" fill="#0369a1" text-anchor="middle">Sistem Pernapasan Manusia</text>

  <g transform="translate(400, 300) scale(1.3)">
    <!-- Pharynx / Larynx -->
    <path d="M -15 -180 L 15 -180 L 15 -120 L -15 -120 Z" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
    
    <!-- Trachea (Cartilage rings) -->
    <path d="M -15 -120 L 15 -120 L 15 20 L -15 20 Z" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <line x1="-15" y1="-100" x2="15" y2="-100" stroke="#0284c7" stroke-width="3"/>
    <line x1="-15" y1="-80" x2="15" y2="-80" stroke="#0284c7" stroke-width="3"/>
    <line x1="-15" y1="-60" x2="15" y2="-60" stroke="#0284c7" stroke-width="3"/>
    <line x1="-15" y1="-40" x2="15" y2="-40" stroke="#0284c7" stroke-width="3"/>
    <line x1="-15" y1="-20" x2="15" y2="-20" stroke="#0284c7" stroke-width="3"/>
    <line x1="-15" y1="0" x2="15" y2="0" stroke="#0284c7" stroke-width="3"/>
    
    <!-- Left Bronchus -->
    <path d="M 0 10 L 15 20 L 60 70 L 40 85 L 0 40 Z" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    
    <!-- Right Bronchus (shorter and wider in reality, simplified here) -->
    <path d="M 0 10 L -15 20 L -50 70 L -30 85 L 0 40 Z" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>

    <!-- Left Lung -->
    <path d="M 40 50 C 90 20 130 80 140 160 C 150 240 100 280 40 270 C 10 265 -10 200 10 120 C 15 100 25 70 40 50 Z" fill="#fca5a5" stroke="#be123c" stroke-width="2" opacity="0.8"/>
    
    <!-- Right Lung (has 3 lobes, simplified) -->
    <path d="M -40 50 C -90 20 -140 80 -150 160 C -160 240 -110 280 -40 270 C -10 265 10 200 -10 120 C -15 100 -25 70 -40 50 Z" fill="#fca5a5" stroke="#be123c" stroke-width="2" opacity="0.8"/>
    
    <!-- Diaphragm -->
    <path d="M -160 280 Q 0 220 160 280" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
